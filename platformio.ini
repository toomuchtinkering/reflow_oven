; reflow_oven — PlatformIO configuration
; See docs/superpowers/specs/... §10 for the rationale.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
; Pre-build hooks (run on EVERY build, before the source glob):
;  - pio_gen_web_asset.py rebuilds src/web/tuning_html_gz.c from the web sources
;    so edits to tuning.html/fit.js/app.js can't ship a stale embedded page.
;  - pio_gen_version.py regenerates <build_dir>/version.h (FIRMWARE_VERSION_STR)
;    from git describe, so the version stamp is never stale and each env reads
;    its OWN version.h. Both rewrite only when their output changes.
extra_scripts =
    pre:tools/pio_gen_web_asset.py
    pre:tools/pio_gen_version.py
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    -I src
    -I .pio/build/${PIOENV}   ; this env's generated version.h (see pio_gen_version.py)
; IDF-managed components (lvgl/lvgl, espressif/esp_lvgl_port,
; espressif/esp_lcd_st7796, atanisoft/esp_lcd_touch_xpt2046) are declared in
; src/idf_component.yml and resolved by the IDF Component Manager at
; CMake-configure time.  PlatformIO's lib_deps cannot reach
; components.espressif.com, so those entries are omitted here.

[env:native]
platform = native
test_framework = unity
test_filter = test_*
test_build_src = yes
; The native env compiles src/ for host-side TDD of the pure-logic
; modules (PID, profile_curve, reflow_sm, ssr_scheduler, nvs_schema).
; ESP-IDF-only modules (anything that #includes driver/, esp_lcd*, nvs,
; freertos, esp_task_wdt, esp_timer, esp_log, etc.) must be excluded —
; their headers don't exist on the host toolchain.
build_src_filter =
    +<*>
    -<main.c>
    -<drivers/thermocouple.c>
    -<drivers/ssr.c>
    -<drivers/display.c>
    -<drivers/touch.c>
    -<drivers/audio.c>
    -<storage/nvs_store.c>
    -<control/control_task.c>
    -<ui/>
    -<diag/>          ; crash_log uses RTC_NOINIT_ATTR + lvgl (ESP-only)
    -<audio/audio_task.c>
build_flags =
    -std=c11
    -Iinclude
    -Isrc
    -lm                       ; touch_cal_math uses sqrtf / fabsf

[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = custom
; $PYTHONEXE = PlatformIO's own interpreter — bare "python" doesn't exist on
; systems that ship python3 only.
upload_command = $PYTHONEXE ${PROJECT_DIR}/tools/ota_upload.py $SOURCE
